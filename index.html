<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Producer Portfolio</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: #0a0a0a;
            color: #ffffff;
            line-height: 1.6;
            overflow-x: hidden;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* Header */
        header {
            padding: 60px 0 40px;
            text-align: center;
            background: linear-gradient(135deg, #1a1a1a 0%, #0a0a0a 100%);
        }

        .producer-name {
            font-size: 3.5rem;
            font-weight: 300;
            letter-spacing: 8px;
            margin-bottom: 10px;
            text-transform: uppercase;
            background: linear-gradient(45deg, #ffffff, #888888);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .producer-title {
            font-size: 1.2rem;
            color: #888888;
            font-weight: 300;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        /* Discography Section */
        .discography {
            padding: 80px 0;
        }

        .section-title {
            font-size: 2rem;
            text-align: center;
            margin-bottom: 60px;
            font-weight: 300;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: #ffffff;
        }

        .albums-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 40px;
            margin-bottom: 40px;
        }

        .album-card {
            background: #111111;
            border-radius: 4px;
            overflow: hidden;
            transition: all 0.4s ease;
            cursor: pointer;
            border: 1px solid #222222;
            position: relative;
        }

        .album-card:hover {
            transform: translateY(-10px);
            border-color: #333333;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }

        .album-cover {
            width: 100%;
            height: 280px;
            background: linear-gradient(135deg, #333333, #1a1a1a);
            position: relative;
            overflow: hidden;
        }

        .album-cover::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, 
                rgba(255,255,255,0.1) 0%, 
                rgba(255,255,255,0.05) 50%, 
                rgba(0,0,0,0.1) 100%);
            z-index: 2;
        }

        .album-cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        .album-placeholder {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 4rem;
            color: #444444;
            z-index: 1;
            display: none;
        }

        .album-cover.no-image .album-placeholder {
            display: block;
        }

        .album-info {
            padding: 25px;
        }

        .album-title {
            font-size: 1.3rem;
            font-weight: 400;
            margin-bottom: 8px;
            color: #ffffff;
        }

        .album-year {
            color: #888888;
            font-size: 0.95rem;
            font-weight: 300;
        }

        .play-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: 3;
        }

        .album-card:hover .play-overlay {
            opacity: 1;
        }

        .play-button {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: #1db954;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .play-button:hover {
            background: #1ed760;
            transform: scale(1.1);
        }

        .play-icon {
            width: 0;
            height: 0;
            border-left: 20px solid #000000;
            border-top: 12px solid transparent;
            border-bottom: 12px solid transparent;
            margin-left: 4px;
        }

        /* Contact Section */
        .contact {
            padding: 80px 0 60px;
            text-align: center;
            border-top: 1px solid #222222;
        }

        .contact-text {
            font-size: 1.1rem;
            color: #ffffff;
            margin-bottom: 20px;
            font-weight: 300;
            letter-spacing: 1px;
        }

        .contact-email {
            font-size: 1.3rem;
            color: #ffffff;
            text-decoration: none;
            border-bottom: 1px solid transparent;
            transition: all 0.3s ease;
            margin-bottom: 30px;
            display: inline-block;
            font-weight: 400;
        }

        .contact-email:hover {
            color: #1db954;
            border-bottom-color: #1db954;
        }

        .social-text {
            font-size: 1rem;
            color: #888888;
            margin-bottom: 10px;
            font-weight: 300;
        }

        .instagram-link {
            font-size: 1.1rem;
            color: #ffffff;
            text-decoration: none;
            transition: all 0.3s ease;
            font-weight: 400;
        }

        .instagram-link:hover {
            color: #E4405F;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .producer-name {
                font-size: 2.5rem;
                letter-spacing: 4px;
            }
            
            .albums-grid {
                grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
                gap: 30px;
            }
            
            .container {
                padding: 0 15px;
            }
        }

        @media (max-width: 480px) {
            .producer-name {
                font-size: 2rem;
                letter-spacing: 2px;
            }
            
            .albums-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

            <h1 class="producer-name">Ivo</h1>

            {

                spotifyUrl: "https://open.spotify.com/intl-es/album/5JHKw6ZkSEJQMuEnjda0Em?si=3-QfYtrfSuWJrbZB3VbfIg"
            }
        ];

        // Función para crear las tarjetas de álbumes
        function createAlbumCards() {
            const albumsGrid = document.getElementById('albumsGrid');
            
            albums.forEach(album => {
                const albumCard = document.createElement('div');
                albumCard.className = 'album-card';
                albumCard.onclick = () => window.open(album.spotifyUrl, '_blank');
                
                // Crear el cover con o sin imagen
                const coverContent = album.coverUrl 
                    ? `<img src="${album.coverUrl}" alt="${album.title} cover" loading="lazy">`
                    : '';
                
                const coverClass = album.coverUrl ? 'album-cover' : 'album-cover no-image';
                
                albumCard.innerHTML = `
                    <div class="${coverClass}">
                        ${coverContent}
                        <div class="album-placeholder">♪</div>
                        <div class="play-overlay">
                            <div class="play-button">
                                <div class="play-icon"></div>
                            </div>
                        </div>
                    </div>
                    <div class="album-info">
                        <h3 class="album-title">${album.title}</h3>
                        <p class="album-year">${album.year}</p>
                    </div>
                `;
                
                albumsGrid.appendChild(albumCard);
            });
        }

        // Inicializar cuando se carga la página
        document.addEventListener('DOMContentLoaded', createAlbumCards);

        // Efecto de parallax sutil en scroll
        window.addEventListener('scroll', () => {
            const scrolled = window.pageYOffset;
            const header = document.querySelector('header');
            header.style.transform = `translateY(${scrolled * 0.3}px)`;
        });
    </script>
</body>
